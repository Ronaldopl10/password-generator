<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820" width="680" height="820">
  <title>Máscara de Iron Man</title>
  <desc>Vector SVG de la máscara de Iron Man, negro sobre transparente</desc>

  <g transform="translate(340,410)">

    <!-- Outer helmet (solid black) -->
    <path fill="black" d="
      M 0,-388
      C -55,-388 -135,-364 -190,-302
      C -235,-252 -258,-185 -260,-110
      C -262,-45 -248,22 -228,80
      C -205,150 -170,210 -135,256
      C -105,297 -72,328 -46,345
      C -24,358 -8,362 0,362
      C 8,362 24,358 46,345
      C 72,328 105,297 135,256
      C 170,210 205,150 228,80
      C 248,22 262,-45 260,-110
      C 258,-185 235,-252 190,-302
      C 135,-364 55,-388 0,-388 Z
    "/>

    <!-- Inner face cutout -->
    <path fill="white" d="
      M 0,-338
      C -45,-338 -110,-318 -155,-265
      C -193,-220 -212,-160 -214,-98
      C -215,-42 -203,22 -186,74
      C -165,138 -136,192 -108,232
      C -82,268 -56,294 -35,306
      C -17,316 -6,319 0,319
      C 6,319 17,316 35,306
      C 56,294 82,268 108,232
      C 136,192 165,138 186,74
      C 203,22 215,-42 214,-98
      C 212,-160 193,-220 155,-265
      C 110,-318 45,-338 0,-338 Z
    "/>

