    "/>

    <!-- Left mid-face panel -->
    <path fill="black" d="
      M -196,8 L -162,18 L -152,95 L -196,68 Z
    "/>

    <!-- Right mid-face panel -->
    <path fill="black" d="
      M 196,8 L 162,18 L 152,95 L 196,68 Z
    "/>

    <!-- Left jaw panel -->
    <path fill="black" d="
      M -196,68 L -152,95 L -148,185 L -118,228 L -135,256 L -170,210 Z
    "/>

    <!-- Right jaw panel -->
    <path fill="black" d="
      M 196,68 L 152,95 L 148,185 L 118,228 L 135,256 L 170,210 Z
    "/>

    <!-- Left cheek -->
    <path fill="black" d="
      M -162,18 L -82,-38 L -70,20 L -78,110 L -62,235 L -50,255
