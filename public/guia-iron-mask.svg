    "/>

    <!-- Mouth gap -->
    <rect fill="white" x="-42" y="235" width="84" height="22" rx="2"/>

    <!-- Chin plate -->
    <path fill="black" d="
      M -42,268 L -32,306 L 32,306 L 42,268 Z
    "/>

    <!-- Lower chin -->
    <path fill="black" d="
      M -46,345
      C -24,358 -8,362 0,362
      C 8,362 24,358 46,345
      L 40,318 C 20,328 8,331 0,331 C -8,331 -20,328 -40,318 Z
    "/>

    <!-- Chin notch -->
    <path fill="black" d="
      M -28,306 L -20,331 L 20,331 L 28,306 L 0,316 Z
    "/>

