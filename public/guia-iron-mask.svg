      C -105,-222 -142,-188 -165,-145
      L -214,-98
      C -212,-160 -193,-220 -155,-265 Z
    "/>

    <!-- Right forehead stripe -->
    <path fill="black" d="
      M 155,-265
      C 148,-316 95,-338 50,-338
      L 72,-240
      C 105,-222 142,-188 165,-145
      L 214,-98
      C 212,-160 193,-220 155,-265 Z
    "/>

    <!-- Left side face panel -->
    <path fill="black" d="
