<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- === Variant 3: KeyShield — Shield + Key for security === -->

  <!-- Shield outline -->
  <path d="M50 4 L18 20 L18 48 C18 68 32 84 50 96 C68 84 82 68 82 48 L82 20 Z"
        stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" fill="none"/>

  <!-- Shield inner border -->
  <path d="M50 12 L26 24 L26 48 C26 64 37 78 50 88 C63 78 74 64 74 48 L74 24 Z"
        stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="none" opacity="0.4"/>

  <!-- Key bow (ring at top of shield) -->
  <circle cx="50" cy="32" r="12" stroke="currentColor" stroke-width="2" fill="none"/>
  <circle cx="50" cy="32" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/>

  <!-- Key shaft through center of shield -->
  <rect x="47" y="44" width="6" height="38" rx="1.5" fill="currentColor"/>

  <!-- Key teeth -->
  <path d="M53 58 L60 58 L60 61 L53 61" fill="currentColor"/>
  <path d="M53 64 L58 64 L58 67 L53 67" fill="currentColor"/>
  <path d="M53 72 L62 72 L62 75 L53 75" fill="currentColor"/>

  <!-- Cross reinforcement lines on shield -->
  <line x1="38" y1="48" x2="38" y2="72" stroke="currentColor" stroke-width="1" opacity="0.3"/>
  <line x1="62" y1="48" x2="62" y2="72" stroke="currentColor" stroke-width="1" opacity="0.3"/>

  <!-- Shield bottom point accent -->
  <line x1="50" y1="82" x2="50" y2="88" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
